name: mirrorcast_engine
description: >-
  MirrorCast's native data plane: screen/audio capture, hardware encoding and
  TLS streaming on Android; TLS server, hardware decoding and low-latency audio
  on macOS. Exposes a small typed Dart API to the app.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mirrorcast.engine
        pluginClass: MirrorcastEnginePlugin
      macos:
        pluginClass: MirrorcastEnginePlugin
