name: mirrorcast
description: >-
  Ultra-low-latency, end-to-end encrypted screen and audio mirroring from an
  Android phone (sender) to a Mac (receiver). One Flutter codebase, native
  data plane.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Native data plane (capture, encode, TLS, decode, audio) + its Dart API.
  mirrorcast_engine:
    path: packages/mirrorcast_engine

  # Material Design widgets (decoupled from the Flutter SDK).
  material_ui: ^1.9.0

  # State management.
  flutter_riverpod: ^3.4.3
  # Bonjour / mDNS: the Mac advertises itself, the phone discovers it.
  bonsoir: ^7.1.6
  # Small local settings (no accounts, nothing leaves the device).
  shared_preferences: ^2.5.6
  # QR code shown on the Mac / scanned on the phone for pairing.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.3
  # Material You colours on Android, accent colour on macOS.
  dynamic_color: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
