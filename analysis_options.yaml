# Static analysis for MirrorCast. Strict on purpose: these rules catch the
# kind of bugs (unawaited futures, implicit dynamic, unsafe casts) that are
# hardest to find at runtime.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unawaited_futures: error
    discarded_futures: warning
  exclude:
    - build/**
    - android/**
    - macos/**

formatter:
  page_width: 120

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - discarded_futures
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
